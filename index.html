function b64ToBytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function deriveKey(pw){var enc=new TextEncoder();var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(SALT),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function unlock(pw){document.getElementById("pwd-err").textContent="";document.getElementById("loading").style.display="block";try{var key=await deriveKey(pw);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(NONCE)},key,b64ToBytes(CT));var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();try{sessionStorage.setItem("dash_pw",pw)}catch(e){}}catch(e){document.getElementById("loading").style.display="none";document.getElementById("pwd-err").textContent="סיסמה שגויה, נסי שוב";var i=document.getElementById("pwd-input");i.value="";i.focus();}}
try{var sp=sessionStorage.getItem("dash_pw");if(sp){unlock(sp)}}catch(e){}
document.getElementById("pwd-btn").addEventListener("click",function(){unlock(document.getElementById("pwd-input").value)});
document.getElementById("pwd-input").addEventListener("keydown",function(e){if(e.key==="Enter")unlock(e.target.value)});
})();
